<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>XLinK — Link Manipulation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --bg2:#0a0a0a;
  --card:#111111;
  --border:#2a2a2a;
  --border2:#3a3a3a;
  --text:#ffffff;
  --text2:#e0e0e0;
  --text3:#b0b0b0;
  --muted:#808080;
  --dim:#505050;
  --pure:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text2);
  font-family:'Noto Sans Bengali',-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.75;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:0;
}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(0,0,0,.96);
  border-bottom:1px solid var(--border);
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:'Share Tech Mono',monospace;
}
.brand-mark{
  width:34px;height:34px;
  border:1px solid var(--pure);
  display:grid;place-items:center;
  font-weight:700;color:var(--pure);font-size:15px;
  font-family:'Share Tech Mono',monospace;
  background:#000;
  position:relative;
  flex-shrink:0;
}
.brand-mark::before{
  content:'';
  position:absolute;inset:3px;
  border:1px solid var(--dim);
  pointer-events:none;
}
.brand-name{
  font-size:18px;font-weight:700;letter-spacing:3px;
  color:var(--pure);
  font-family:'Share Tech Mono',monospace;
  line-height:1.1;
}
.brand-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;color:var(--muted);letter-spacing:2px;
  margin-top:2px;
}
.menu-toggle{
  background:transparent;
  border:1px solid var(--border2);
  color:var(--pure);
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  padding:8px 12px;
  cursor:pointer;
  letter-spacing:1px;
  flex-shrink:0;
}

/* ---------- LAYOUT ---------- */
.layout{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:calc(100vh - 55px);
  position:relative;z-index:1;
}

/* ---------- SIDEBAR ---------- */
aside{
  border-right:1px solid var(--border);
  background:#050505;
  padding:16px 10px;
  overflow-y:auto;
  height:calc(100vh - 55px);
  position:sticky;top:55px;
}
.sidebar-title{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:3px;color:var(--dim);
  text-transform:uppercase;padding:0 10px 12px;
  border-bottom:1px solid var(--border);
  margin-bottom:10px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;
  cursor:pointer;
  font-size:14px;
  border-left:2px solid transparent;
  transition:all .15s;
  color:#c0c0c0;
  font-family:'JetBrains Mono',monospace;
}
.nav-item:hover{background:#0d0d0d;color:var(--pure)}
.nav-item.active{
  background:#131313;
  border-left-color:var(--pure);
  color:var(--pure);
}
.nav-num{
  font-size:11px;color:var(--dim);
  min-width:24px;letter-spacing:1px;
  font-weight:500;
}
.nav-item.active .nav-num{color:var(--pure)}

/* ---------- MAIN ---------- */
main{padding:22px 18px 120px;max-width:900px;width:100%}

/* Progress bar */
.progress-wrap{
  margin-bottom:22px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  letter-spacing:1px;
}
.progress-top{
  display:flex;justify-content:space-between;
  margin-bottom:6px;
}
.progress-bar{
  height:3px;background:#1a1a1a;
  position:relative;overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--pure);
  transition:width .3s ease;
}

/* Term head */
.term-head{margin-bottom:18px}
.term-num{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--muted);letter-spacing:3px;
}
.term-title{
  font-family:'Share Tech Mono',monospace;
  font-size:24px;font-weight:700;letter-spacing:1px;
  margin:8px 0 14px;
  color:var(--pure);
  line-height:1.3;
}
.term-desc{
  font-size:15px;color:var(--text2);
  padding:16px 18px;
  background:#0a0a0a;
  border-left:3px solid var(--pure);
  line-height:1.8;
}

/* Warning */
.warn-banner{
  margin:18px 0 20px;
  padding:13px 16px;
  border:1px solid var(--border2);
  background:#080808;
  color:var(--text3);
  font-size:13px;
  font-family:'JetBrains Mono',monospace;
  display:flex;gap:10px;align-items:flex-start;
  line-height:1.7;
}
.warn-banner strong{color:var(--pure);font-weight:700}

/* Demo card */
.demo-card{
  margin-top:18px;
  background:#0a0a0a;
  border:1px solid var(--border);
  padding:18px;
}
.demo-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--muted);letter-spacing:2px;
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.demo-label::before{
  content:'';
  width:6px;height:6px;background:var(--pure);
  animation:blink 1.4s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* Fake browser */
.browser{
  border:1px solid var(--border2);
  background:#040404;
  margin-bottom:16px;
}
.browser-top{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;
  background:#0d0d0d;
  border-bottom:1px solid var(--border);
}
.browser-dots{display:flex;gap:5px}
.browser-dots span{
  width:9px;height:9px;border-radius:50%;
  background:#2a2a2a;
}
.browser-addr{
  flex:1;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  padding:6px 10px;
  background:#000;
  border:1px solid var(--border);
  color:var(--text3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:all .3s;
}
.browser-addr.danger{
  color:var(--pure);
  border-color:var(--pure);
  background:#151515;
}
.browser-body{
  padding:22px 16px;
  min-height:130px;
  display:grid;place-items:center;
  text-align:center;
  transition:background .3s;
}
.browser-body.redirected{background:#0f0f0f}
.site-fake h4{font-size:16px;margin-bottom:6px;color:var(--pure);font-weight:600}
.site-fake p{color:var(--text3);font-size:13px;font-family:'JetBrains Mono',monospace}
.site-hack h4{color:var(--pure);font-size:16px;margin-bottom:6px;font-weight:700;letter-spacing:1px}
.site-hack p{color:var(--text3);font-size:13px;font-family:'JetBrains Mono',monospace}

/* Buttons */
.btn{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:600;letter-spacing:1.5px;
  padding:12px 20px;
  border:1px solid var(--pure);
  background:transparent;
  color:var(--pure);cursor:pointer;
  transition:all .15s;
  text-transform:uppercase;
  min-height:44px;
}
.btn:hover,.btn:active{background:var(--pure);color:#000}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{
  border-color:var(--border2);
  color:var(--text3);
}
.btn.ghost:hover,.btn.ghost:active{
  border-color:var(--pure);
  background:#111;
  color:var(--pure);
}

/* Log */
.log{
  margin-top:14px;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  padding:13px 14px;
  background:#000;
  border:1px solid var(--border);
  color:var(--text3);
  min-height:48px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.75;
}
.log.warn{color:var(--text2);border-color:var(--border2)}
.log.danger{color:var(--pure);border-color:var(--pure);background:#0f0f0f}

/* Link sample */
.link-sample{
  font-family:'JetBrains Mono',monospace;
  font-size:13.5px;
  color:var(--pure);
  text-decoration:underline;
  cursor:pointer;
  display:inline-block;
  padding:10px 14px;
  background:#0d0d0d;
  border:1px dashed var(--border2);
  transition:all .15s;
  word-break:break-all;
  margin:6px 0;
}
.link-sample:hover,.link-sample:active{
  background:#151515;
  border-color:var(--pure);
}

/* Code */
.code{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  background:#000;
  border:1px solid var(--border);
  padding:14px 16px;
  color:var(--text2);
  overflow-x:auto;
  line-height:1.85;
  margin:12px 0;
  white-space:pre;
  -webkit-overflow-scrolling:touch;
}
.code .tag{color:#e0e0e0}
.code .attr{color:#a8a8a8}
.code .val{color:var(--pure)}
.code .cmt{color:var(--dim);font-style:italic}

/* Compare */
.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0;
}
.compare-box{
  padding:15px 12px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  text-align:center;
  border:1px solid var(--border2);
  background:#000;
  word-break:break-all;
  color:var(--text3);
}
.compare-box.safe{border-color:#3a3a3a;color:var(--text2)}
.compare-box.evil{border-color:var(--pure);color:var(--pure);background:#131313}
.compare-box small{
  display:block;font-size:10px;letter-spacing:2px;
  color:var(--dim);margin-bottom:8px;text-transform:uppercase;
}
.compare-box.evil small{color:var(--muted)}
.hl-char{
  background:#2a2a2a;
  border-bottom:2px solid var(--pure);
  padding:0 3px;
}

/* Steps */
.steps{
  margin-top:20px;
  padding:16px 18px;
  background:#0a0a0a;
  border:1px solid var(--border);
}
.steps h4{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--pure);letter-spacing:2px;
  margin-bottom:12px;text-transform:uppercase;
}
.steps ol{padding-left:22px;font-size:14px;color:var(--text2)}
.steps ol li{margin-bottom:8px;line-height:1.7}
.steps ol li b{color:var(--pure)}

/* Bottom navigation (Next/Prev) */
.bottom-nav{
  display:flex;gap:10px;
  margin-top:30px;
  padding-top:20px;
  border-top:1px solid var(--border);
  flex-wrap:wrap;
}
.bottom-nav .btn{flex:1;min-width:130px}
.bottom-nav .btn.next{
  background:var(--pure);color:#000;
}
.bottom-nav .btn.next:hover,.bottom-nav .btn.next:active{
  background:#ccc;color:#000;
}
.bottom-nav .btn.prev{
  border-color:var(--border2);
  color:var(--text3);
}
.bottom-nav .btn.prev:hover,.bottom-nav .btn.prev:active{
  border-color:var(--pure);
  background:#111;
  color:var(--pure);
}

/* Animations */
@keyframes glitch{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-2px,1px)}
  40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,-2px)}
  80%{transform:translate(1px,2px)}
}
.glitch{animation:glitch .35s}

/* Backdrop */
.backdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  z-index:99;
  opacity:0;
  transition:opacity .25s;
}
.backdrop.show{display:block;opacity:1}

/* ---------- MOBILE ---------- */
@media(max-width:820px){
  header{padding:10px 12px}
  .brand-name{font-size:16px;letter-spacing:2px}
  .brand-mark{width:32px;height:32px;font-size:14px}
  .brand-sub{font-size:8px}

  .layout{grid-template-columns:1fr;min-height:calc(100vh - 55px)}

  aside{
    position:fixed;
    top:0;left:0;bottom:0;
    width:82%;
    max-width:320px;
    height:100vh;
    z-index:100;
    transform:translateX(-100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    border-right:1px solid var(--border2);
    padding:70px 10px 20px;
    overflow-y:auto;
    background:#050505;
  }
  aside.open{transform:translateX(0)}
  aside::before{
    content:'SELECT TERM';
    position:absolute;top:24px;left:20px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:3px;
    color:var(--muted);
  }
  .sidebar-title{display:none}
  .nav-item{font-size:15px;padding:13px 14px}

  main{padding:18px 14px 140px}
  .term-title{font-size:20px;letter-spacing:.5px}
  .term-desc{font-size:14.5px;padding:14px 16px;line-height:1.85}
  .demo-card{padding:14px}
  .compare{grid-template-columns:1fr;gap:8px}
  .compare-box{font-size:13px;padding:13px 10px}
  .code{font-size:11.5px;padding:12px 14px;line-height:1.8}
  .btn{font-size:12px;padding:11px 16px;letter-spacing:1px;width:100%}
  .log{font-size:12px;padding:12px}
  .link-sample{font-size:13px;padding:10px 12px}
  .warn-banner{font-size:12.5px;padding:12px 14px}
  .browser-addr{font-size:11.5px}
  .bottom-nav .btn{width:100%;flex:none}
  .bottom-nav{flex-direction:column}
}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#2a2a2a}
::-webkit-scrollbar-thumb:hover{background:#444}

/* Smooth scroll */
html{scroll-behavior:smooth}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">X</div>
    <div>
      <div class="brand-name">XLinK</div>
      <div class="brand-sub">LINK MANIPULATION LAB</div>
    </div>
  </div>
  <button class="menu-toggle" id="menuToggle">[ MENU ]</button>
</header>

<div class="backdrop" id="backdrop"></div>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-title">// TERMS</div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* =========================================================
   XLinK — Link Manipulation Lab
   Mobile-first, sequential learning flow.
   ========================================================= */

function browser(id, addr, bodyHtml){
  return `
    <div class="browser" id="${id}">
      <div class="browser-top">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-addr" id="${id}-addr">${addr}</div>
      </div>
      <div class="browser-body" id="${id}-body">${bodyHtml}</div>
    </div>`;
}

function setLog(id, text, cls){
  const el = document.getElementById(id);
  if(!el) return;
  el.className = 'log' + (cls ? ' '+cls : '');
  el.textContent = text;
}

const TERMS = [
{
id:'url-cloaking', num:'01', title:'URL Cloaking',
desc:'ব্রাউজার বা সার্চ ইঞ্জিনকে দেখানো হয় এক ঠিকানা কিন্তু আসলে ভিতরে অন্য ঠিকানায় তথা হ্যাকিং লিংকে নিয়ে যাওয়া হয়। যেমন: লেখা "bank.com", ক্লিক করলে যায় "hacker.com" তে।',
render(){
  return browser('uc',
    '[ LOCK ] https://bank.com/login',
    `<div class="site-fake" id="uc-site">
       <h4>Secure Bank</h4>
       <p>Trusted banking portal — please sign in</p>
     </div>`
  ) + `
    <button class="btn" data-act="uc-run">RUN DEMO</button>
    <div class="log" id="uc-log">অ্যাড্রেস বারে এখনো bank.com দেখাচ্ছে...</div>
  `;
},
init(){
  document.querySelector('[data-act="uc-run"]').onclick = () => {
    const addr = document.getElementById('uc-addr');
    const body = document.getElementById('uc-body');
    const site = document.getElementById('uc-site');
    addr.classList.add('danger');
    body.classList.add('redirected');
    site.outerHTML = `<div class="site-hack">
        <h4>[ HACKER SERVER ]</h4>
        <p>আপনার ক্রেডেনশিয়াল চুরি হয়ে গেছে</p>
      </div>`;
    setLog('uc-log',
      '⚠ অ্যাড্রেস বার এখনো "bank.com" দেখাচ্ছে,\nকিন্তু ভিতরের পেজ এখন hacker.com এর।\nএটাই URL Cloaking।',
      'danger');
  };
}},

{
id:'link-cloaking', num:'02', title:'Link Cloaking',
desc:'ক্লিক করার লিংকটা এমনভাবে লুকানো থাকে যে বোঝা যায় না কোথায় নিয়ে যাবে — অর্থাৎ ড্রিবলিং করে তাতে ক্লিক করলে হ্যাকারের নিজের লিংকে ফোর্সড ডেস্টিনেটেড করবে।',
render(){
  return `
    <p style="margin-bottom:14px;color:var(--text2);font-size:14.5px">নিচের লিংকটির উপর হোভার করুন — কিছুই দেখা যাবে না। ক্লিক করলে আসল গন্তব্য প্রকাশ পাবে।</p>
    <span class="link-sample" id="lc-link">Read full article</span>
    <div class="log" id="lc-log">Hover করলে কিছুই দেখাচ্ছে না...</div>
  `;
},
init(){
  const link = document.getElementById('lc-link');
  link.onmouseenter = () => setLog('lc-log','Hover করলেও কোনো URL টুলটিপ দেখাচ্ছে না। ভুয়া নিরাপত্তা।','warn');
  link.onclick = (e) => {
    e.preventDefault();
    link.classList.add('glitch');
    setLog('lc-log',
      '⚠ লিংকটি আসলে এখানে নিয়ে যেত:\nhttps://evil-malware-download.xyz/payload.exe\n\nলিংকের টেক্সটে কিছুই লেখা ছিল না, তাই আপনি বুঝতে পারেননি।',
      'danger');
  };
}},

{
id:'hyperlink-spoofing', num:'03', title:'Hyperlink Spoofing',
desc:'লিংকের উপরে যে নাম বা লেখা দেখা যায় সেটা আসলে আসল নয় বরং ভিতরে অন্য লিংক বসানো থাকে (এটিই মূল হ্যাকিং লিংক), যেমনটা লেখার শুরুতে উপরের উদাহরণে দেখানো হয়েছে।',
render(){
  return `
    <p style="margin-bottom:12px;color:var(--text2);font-size:14.5px">নিচের HTML কোডটি লক্ষ্য করুন — টেক্সট বলে <b style="color:#fff">trickbd.com</b>, কিন্তু href বলে <b style="color:#fff">google.com</b>।</p>
    <div class="code">&lt;<span class="tag">a</span> <span class="attr">href</span>=<span class="val">"https://google.com"</span>&gt;
  https://trickbd.com
&lt;/<span class="tag">a</span>&gt;</div>

/* =========================================================
   RENDER
   ========================================================= */

const sidebar = document.getElementById('sidebar');
const main    = document.getElementById('main');
const menuToggle = document.getElementById('menuToggle');
const backdrop   = document.getElementById('backdrop');

/* Build sidebar */
TERMS.forEach((t, i) => {
  const el = document.createElement('div');
  el.className = 'nav-item' + (i === 0 ? ' active' : '');
  el.dataset.id = t.id;
  el.innerHTML = `<span class="nav-num">${t.num}</span><span>${t.title}</span>`;
  el.onclick = () => { selectTerm(t.id); closeMenu(); };
  sidebar.appendChild(el);
});

/* Sequential navigation */
function renderBottomNav(idx){
  const prev = TERMS[idx-1];
  const next = TERMS[idx+1];
  return `
    <div class="bottom-nav">
      ${prev ? `<button class="btn prev" data-go="${prev.id}">&larr; ${prev.num}. ${prev.title}</button>` : ''}
      ${next ? `<button class="btn next" data-go="${next.id}">${next.num}. ${next.title} &rarr;</button>` : '<button class="btn next" data-go="'+TERMS[0].id+'">সম্পূর্ণ শেষ &mdash; আবার শুরু করুন &rarr;</button>'}
    </div>
  `;
}

function selectTerm(id){
  const idx = TERMS.findIndex(x => x.id === id);
  if(idx === -1) return;
  const t = TERMS[idx];

  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.id === id);
  });

  const progress = Math.round(((idx+1) / TERMS.length) * 100);

  main.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-top">
        <span>PROGRESS: ${idx+1} / ${TERMS.length}</span>
        <span>${progress}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    </div>

    <div class="term-head">
      <div class="term-num">// TERM ${t.num}</div>
      <h1 class="term-title">${t.title}</h1>
      <div class="term-desc">${t.desc}</div>
    </div>

    <div class="warn-banner">
      <span>[!]</span>
      <div><strong>শিক্ষামূলক:</strong> এটি সাইবার সিকিউরিটি রিসার্চ ও সচেতনতার জন্য। বাস্তব সিস্টেমে প্রয়োগ দণ্ডনীয়।</div>
    </div>

    <div class="demo-card">
      <div class="demo-label">LIVE DEMO / ${t.title}</div>
      ${t.render()}
    </div>

    ${renderBottomNav(idx)}
  `;

  if(t.init) t.init();

  /* Attach bottom nav listeners */
  document.querySelectorAll('[data-go]').forEach(b => {
    b.onclick = () => {
      selectTerm(b.dataset.go);
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });

  /* Ensure menu closed */
  closeMenu();
}

function openMenu(){
  sidebar.classList.add('open');
  backdrop.classList.add('show');
}
function closeMenu(){
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
}

menuToggle.onclick = () => {
  if(sidebar.classList.contains('open')) closeMenu();
  else openMenu();
};
backdrop.onclick = closeMenu;

/* initial */
selectTerm(TERMS[0].id);

/* keyboard nav */
document.addEventListener('keydown', e => {
  const idx = TERMS.findIndex(x =>
    document.querySelector('.nav-item.active')?.dataset.id === x.id);
  if(e.key === 'ArrowDown' && idx < TERMS.length-1){
    selectTerm(TERMS[idx+1].id);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if(e.key === 'ArrowUp' && idx > 0){
    selectTerm(TERMS[idx-1].id);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if(e.key === 'Escape') closeMenu();
});
</script>
